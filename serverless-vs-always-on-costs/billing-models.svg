<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520"><rect width="1440" height="520" fill="#11101b"/><style>text{font-family:Arial,sans-serif;fill:#f4f1ff}.small{font-size:19px;fill:#c2bdd3}.title{font-size:25px;font-weight:700}</style><text x="55" y="64" font-size="34" font-weight="700">Choose what stays running between requests</text><text x="55" y="104" class="small">Billing models overlap. Sleep is optional; startup tolerance and actual demand decide the fit.</text><rect x="55" y="150" width="315" height="245" rx="16" fill="#211e30" stroke="#4c445e"/><text x="77" y="195" class="title">EC2 / Render</text><text x="77" y="240" font-size="22">Selected capacity</text><text x="77" y="288" class="small">Pay while instances run</text><text x="77" y="353" font-size="18">Steady work; stay ready</text><rect x="398" y="150" width="315" height="245" rx="16" fill="#211e30" stroke="#4c445e"/><text x="420" y="195" class="title">Fly.io</text><text x="420" y="240" font-size="22">Stop / start Machines</text><text x="420" y="288" class="small">Pay for running capacity</text><text x="420" y="353" font-size="18">Long quiet gaps</text><rect x="741" y="150" width="315" height="245" rx="16" fill="#33214f" stroke="#b88aff"/><text x="763" y="195" class="title">Railway</text><text x="763" y="240" font-size="22">Server consumption</text><text x="763" y="288" class="small">CPU used + memory held</text><text x="763" y="353" font-size="18">Variable load; familiar server</text><rect x="1084" y="150" width="315" height="245" rx="16" fill="#211e30" stroke="#4c445e"/><text x="1106" y="195" class="title">Vercel / Lambda</text><text x="1106" y="240" font-size="22">Managed functions</text><text x="1106" y="288" class="small">Active CPU or invocation time</text><text x="1106" y="353" font-size="18">Function-compatible requests</text><text x="55" y="456" class="small">Compare billable quantities, full account costs, peak capacity, and engineering effort.</text></svg>